services:
  spark-master:
    build:
      context: ./docker/spark-master
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "6066:6066"  # Spark Master REST API
    volumes:
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network

  spark-worker-1:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8081:8081"  # Worker 1 Web UI
    volumes:
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network

  spark-worker-2:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8082:8082"  # Worker 2 Web UI
    volumes:
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network

  spark-worker-3:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-3
    hostname: spark-worker-3
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
      - SPARK_WORKER_WEBUI_PORT=8083
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8083:8083"  # Worker 3 Web UI
    volumes:
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network

  jupyter-notebook:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: jupyter-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/notebooks
      - ./src:/home/jovyan/src
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - spark-network
    depends_on:
      - spark-master

  api-server:
    build:
      context: ./docker/api-server
      dockerfile: Dockerfile
    container_name: api-server
    ports:
      - "5001:5000"
    volumes:
      - ./src:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./templates:/opt/spark-apps/templates
      - ./static:/opt/spark-apps/static
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - DATA_PATH=/opt/spark-data
      - MODEL_PATH=/opt/spark-data/models
      - PYTHONPATH=/opt/spark-apps
    networks:
      - spark-network
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3

networks:
  spark-network:
    driver: bridge

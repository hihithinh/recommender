<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fas fa-book-reader"></i>
                    Book Recommendation System
                </h1>
                <p class="text-blue-100 mt-2">Powered by Spark ALS + LightGBM</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Input Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-user-circle text-blue-600"></i>
                    Get Personalized Recommendations
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">User ID</label>
                        <input type="text" id="userId" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter user ID (e.g., 276725)">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Number of Recommendations</label>
                        <input type="number" id="topN" value="10" min="1" max="50"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    
                    <div class="flex items-end">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="useLgbm" checked
                                   class="w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                            <span class="text-sm font-medium text-gray-700">Use LightGBM Re-ranking</span>
                        </label>
                    </div>
                </div>
                
                <button onclick="getRecommendations()" 
                        class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-md">
                    <i class="fas fa-magic mr-2"></i>
                    Get Recommendations
                </button>

                <div class="mt-4">
                    <a href="/new-user" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-user-plus mr-1"></i> New user? Get recommendations based on your profile
                    </a>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-gray-600">Loading recommendations...</p>
            </div>

            <!-- Error Message -->
            <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-8 rounded">
                <div class="flex">
                    <i class="fas fa-exclamation-circle text-red-500 mr-3 mt-1"></i>
                    <div>
                        <p class="text-red-800 font-medium">Error</p>
                        <p id="errorMessage" class="text-red-700 text-sm"></p>
                    </div>
                </div>
            </div>

            <!-- User History Section -->
            <div id="historySection" class="hidden mb-8">
                <h3 class="text-xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-history text-green-600"></i>
                    Your Reading History
                </h3>
                <div id="userHistory" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
            </div>

            <!-- Recommendations Section -->
            <div id="recommendationsSection" class="hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-book-open text-blue-600"></i>
                        Your Personalized Book Recommendations
                    </h3>
                </div>
                <div id="recommendations" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        async function getRecommendations() {
            const userId = document.getElementById('userId').value.trim();
            const topN = parseInt(document.getElementById('topN').value);
            const useLgbm = document.getElementById('useLgbm').checked;

            if (!userId) {
                showError('Please enter a User ID');
                return;
            }

            hideError();
            showLoading();
            hideResults();

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        top_n: topN,
                        use_lgbm: useLgbm
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to get recommendations');
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        function displayResults(data) {
            // Display user history
            if (data.user_history && data.user_history.length > 0) {
                const historyHtml = data.user_history.map(book => `
                    <div class="bg-white rounded-lg shadow-sm p-3 hover:shadow-md transition-shadow">
                        <img src="${book.image_url || 'https://via.placeholder.com/150x225?text=No+Image'}" 
                             alt="${book.title}" 
                             class="w-full h-40 object-contain bg-gray-50 rounded mb-2">
                        <p class="text-xs font-medium text-gray-800 line-clamp-2">${book.title}</p>
                        <p class="text-xs text-gray-600 line-clamp-1">${book.author}</p>
                        <div class="flex items-center mt-1">
                            <i class="fas fa-star text-yellow-500 text-xs"></i>
                            <span class="text-xs text-gray-700 ml-1">${book.rating.toFixed(1)}</span>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('userHistory').innerHTML = historyHtml;
                document.getElementById('historySection').classList.remove('hidden');
            }

            // Display recommendations
            const recsHtml = data.recommendations.map(book => {
                const scoreInfo = book.lgbm_score !== null && book.als_score !== null
                    ? `
                        <div class="space-y-1">
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-gray-500">ALS</span>
                                <span class="text-xs font-semibold text-blue-600">${book.als_score.toFixed(2)}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-xs text-gray-500">LightGBM</span>
                                <span class="text-xs font-semibold text-green-600">${book.lgbm_score.toFixed(2)}</span>
                            </div>
                        </div>
                    `
                    : book.als_score !== null
                    ? `
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">ALS Score</span>
                            <span class="text-xs font-semibold text-blue-600">${book.als_score.toFixed(2)}</span>
                        </div>
                    `
                    : `
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-gray-500">Popularity</span>
                            <span class="text-xs font-semibold text-yellow-600">${book.avg_rating ? book.avg_rating.toFixed(1) : 'N/A'}</span>
                        </div>
                    `;

                return `
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-2xl transition-all duration-300 hover:-translate-y-1">
                        <div class="relative">
                            <img src="${book.image_url || 'https://via.placeholder.com/200x300?text=No+Image'}" 
                                 alt="${book.title}" 
                                 class="w-full h-80 object-contain bg-gray-50">
                            <div class="absolute top-2 right-2">
                                <span class="bg-yellow-400 text-yellow-900 px-2 py-1 rounded-full text-xs font-bold">
                                    <i class="fas fa-star"></i> Recommended
                                </span>
                            </div>
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-base text-gray-900 line-clamp-2 mb-2 min-h-[3rem]">${book.title}</h4>
                            <p class="text-sm text-gray-700 mb-2 font-medium">
                                <i class="fas fa-feather text-blue-500"></i> ${book.author}
                            </p>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs text-gray-500">
                                    <i class="fas fa-building text-gray-400"></i> ${book.publisher}
                                </span>
                                ${book.year ? `
                                    <span class="text-xs text-gray-500">
                                        <i class="fas fa-calendar text-gray-400"></i> ${book.year}
                                    </span>
                                ` : ''}
                            </div>
                            <div class="border-t border-gray-200 pt-3 mt-3">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs font-semibold text-gray-600">
                                        <i class="fas fa-chart-line text-blue-500"></i> Match Score
                                    </span>
                                </div>
                                ${scoreInfo}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('recommendations').innerHTML = recsHtml;
            document.getElementById('recommendationsSection').classList.remove('hidden');
            
            // Smooth scroll to recommendations
            setTimeout(() => {
                document.getElementById('recommendationsSection').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 100);
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }

        function hideResults() {
            document.getElementById('historySection').classList.add('hidden');
            document.getElementById('recommendationsSection').classList.add('hidden');
        }
    </script>
</body>
</html>

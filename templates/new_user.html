<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New User - Book Recommendations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <h1 class="text-3xl font-bold flex items-center gap-3">
                    <i class="fas fa-user-plus"></i>
                    New User Book Recommendations
                </h1>
                <p class="text-blue-100 mt-2">Tell us about yourself and get personalized book recommendations!</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Input Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h2 class="text-2xl font-semibold mb-6 text-gray-800">
                    <i class="fas fa-user-circle text-blue-600"></i>
                    Your Profile
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <!-- Age -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-birthday-cake text-purple-500"></i> Age
                        </label>
                        <input type="number" id="age" min="1" max="120"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter your age (e.g., 25)">
                    </div>
                    
                    <!-- Location -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-map-marker-alt text-red-500"></i> Location
                        </label>
                        <input type="text" id="location"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="City, Country (e.g., New York, USA)">
                    </div>
                </div>

                <!-- Favorite Authors -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-pen-fancy text-green-500"></i> Favorite Authors
                    </label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="authorInput"
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter author name (e.g., J.K. Rowling)">
                        <button onclick="addAuthor()" 
                                class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                    <div id="authorsList" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Favorite Genres -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-book text-orange-500"></i> Favorite Genres (Optional)
                    </label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="genreInput"
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="Enter genre (e.g., Fantasy, Mystery)">
                        <button onclick="addGenre()" 
                                class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 transition-colors">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </div>
                    <div id="genresList" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Number of Recommendations -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-list-ol text-indigo-500"></i> Number of Recommendations
                    </label>
                    <input type="number" id="topN" value="10" min="1" max="50"
                           class="w-full md:w-48 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <button onclick="getRecommendations()" 
                        class="w-full md:w-auto px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium shadow-md">
                    <i class="fas fa-magic mr-2"></i>
                    Get My Recommendations
                </button>

                <div class="mt-4">
                    <a href="/" class="text-blue-600 hover:text-blue-800">
                        <i class="fas fa-arrow-left mr-1"></i> Back to existing user recommendations
                    </a>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden text-center py-8">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <p class="mt-4 text-gray-600">Finding perfect books for you...</p>
            </div>

            <!-- Error Message -->
            <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 mb-8 rounded">
                <div class="flex">
                    <i class="fas fa-exclamation-circle text-red-500 mr-3 mt-1"></i>
                    <div>
                        <p class="text-red-800 font-medium">Error</p>
                        <p id="errorMessage" class="text-red-700 text-sm"></p>
                    </div>
                </div>
            </div>

            <!-- Profile Summary -->
            <div id="profileSection" class="hidden mb-8">
                <div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg shadow-md p-6">
                    <h3 class="text-xl font-semibold mb-4 text-gray-800">
                        <i class="fas fa-user text-blue-600"></i>
                        Your Profile Summary
                    </h3>
                    <div id="profileSummary" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>

            <!-- Recommendations Section -->
            <div id="recommendationsSection" class="hidden">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-2xl font-bold text-gray-900">
                        <i class="fas fa-book-open text-blue-600"></i>
                        Your Personalized Book Recommendations
                    </h3>
                </div>
                <div id="recommendations" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        let favoriteAuthors = [];
        let favoriteGenres = [];

        function addAuthor() {
            const input = document.getElementById('authorInput');
            const author = input.value.trim();
            if (author && !favoriteAuthors.includes(author)) {
                favoriteAuthors.push(author);
                updateAuthorsList();
                input.value = '';
            }
        }

        function removeAuthor(author) {
            favoriteAuthors = favoriteAuthors.filter(a => a !== author);
            updateAuthorsList();
        }

        function updateAuthorsList() {
            const list = document.getElementById('authorsList');
            list.innerHTML = favoriteAuthors.map(author => `
                <span class="inline-flex items-center gap-2 px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm">
                    ${author}
                    <button onclick="removeAuthor('${author}')" class="hover:text-green-900">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');
        }

        function addGenre() {
            const input = document.getElementById('genreInput');
            const genre = input.value.trim();
            if (genre && !favoriteGenres.includes(genre)) {
                favoriteGenres.push(genre);
                updateGenresList();
                input.value = '';
            }
        }

        function removeGenre(genre) {
            favoriteGenres = favoriteGenres.filter(g => g !== genre);
            updateGenresList();
        }

        function updateGenresList() {
            const list = document.getElementById('genresList');
            list.innerHTML = favoriteGenres.map(genre => `
                <span class="inline-flex items-center gap-2 px-3 py-1 bg-orange-100 text-orange-800 rounded-full text-sm">
                    ${genre}
                    <button onclick="removeGenre('${genre}')" class="hover:text-orange-900">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');
        }

        // Allow Enter key to add authors/genres
        document.getElementById('authorInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addAuthor();
            }
        });

        document.getElementById('genreInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addGenre();
            }
        });

        async function getRecommendations() {
            const age = document.getElementById('age').value;
            const location = document.getElementById('location').value.trim();
            const topN = parseInt(document.getElementById('topN').value);

            hideError();
            showLoading();
            hideResults();

            try {
                const response = await fetch('/api/recommend/new-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        age: age ? parseInt(age) : null,
                        location: location || null,
                        favorite_authors: favoriteAuthors,
                        favorite_genres: favoriteGenres,
                        top_n: topN
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to get recommendations');
                }

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }

        function displayResults(data) {
            // Display profile summary
            const profileHtml = `
                ${data.profile.age ? `<div><strong>Age:</strong> ${data.profile.age}</div>` : ''}
                ${data.profile.location ? `<div><strong>Location:</strong> ${data.profile.location}</div>` : ''}
                ${data.profile.favorite_authors.length > 0 ? `<div><strong>Favorite Authors:</strong> ${data.profile.favorite_authors.join(', ')}</div>` : ''}
                ${data.profile.favorite_genres.length > 0 ? `<div><strong>Favorite Genres:</strong> ${data.profile.favorite_genres.join(', ')}</div>` : ''}
            `;
            document.getElementById('profileSummary').innerHTML = profileHtml;
            document.getElementById('profileSection').classList.remove('hidden');

            // Display recommendations
            const recsHtml = data.recommendations.map(book => {

                return `
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-2xl transition-all duration-300 hover:-translate-y-1">
                        <div class="relative">
                            <img src="${book.image_url || 'https://via.placeholder.com/200x300?text=No+Image'}" 
                                 alt="${book.title}" 
                                 class="w-full h-80 object-contain bg-gray-50">
                            ${book.reason ? `
                                <div class="absolute top-2 right-2">
                                    <span class="bg-blue-500 text-white px-2 py-1 rounded-full text-xs font-bold">
                                        <i class="fas fa-heart"></i>
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-base text-gray-900 line-clamp-2 mb-2 min-h-[3rem]">${book.title}</h4>
                            <p class="text-sm text-gray-700 mb-2 font-medium">
                                <i class="fas fa-feather text-blue-500"></i> ${book.author}
                            </p>
                            ${book.reason ? `
                                <div class="mb-2">
                                    <span class="inline-block px-2 py-1 bg-blue-50 text-blue-700 text-xs rounded">
                                        <i class="fas fa-lightbulb"></i> ${book.reason}
                                    </span>
                                </div>
                            ` : ''}
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs text-gray-500">
                                    <i class="fas fa-building text-gray-400"></i> ${book.publisher}
                                </span>
                                ${book.year ? `
                                    <span class="text-xs text-gray-500">
                                        <i class="fas fa-calendar text-gray-400"></i> ${book.year}
                                    </span>
                                ` : ''}
                            </div>
                            ${book.avg_rating ? `
                                <div class="border-t border-gray-200 pt-2 mt-2">
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs text-gray-500">Rating</span>
                                        <div class="flex items-center">
                                            <i class="fas fa-star text-yellow-500 text-xs"></i>
                                            <span class="text-xs font-semibold text-gray-700 ml-1">${book.avg_rating.toFixed(1)}</span>
                                            <span class="text-xs text-gray-400 ml-1">(${book.rating_count})</span>
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('recommendations').innerHTML = recsHtml;
            document.getElementById('recommendationsSection').classList.remove('hidden');
            
            // Smooth scroll to recommendations
            setTimeout(() => {
                document.getElementById('recommendationsSection').scrollIntoView({ 
                    behavior: 'smooth', 
                    block: 'start' 
                });
            }, 100);
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error').classList.add('hidden');
        }

        function hideResults() {
            document.getElementById('profileSection').classList.add('hidden');
            document.getElementById('recommendationsSection').classList.add('hidden');
        }
    </script>
</body>
</html>

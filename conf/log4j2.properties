# Custom Log4j2 configuration for Spark
# Limits stack traces to 3 lines for easier debugging

# Root logger
rootLogger.level = WARN
rootLogger.appenderRef.stdout.ref = console

# Console appender with custom pattern
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
# %xEx{3} limits exception stack traces to 3 lines
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%xEx{3}

# Suppress verbose loggers
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = ERROR

logger.hdfs.name = org.apache.hadoop.hdfs
logger.hdfs.level = ERROR

logger.datastreamer.name = org.apache.hadoop.hdfs.DataStreamer
logger.datastreamer.level = FATAL

logger.ipc.name = org.apache.hadoop.ipc
logger.ipc.level = FATAL

logger.spark_network.name = org.apache.spark.network
logger.spark_network.level = FATAL

logger.blockmanager.name = org.apache.spark.storage.BlockManager
logger.blockmanager.level = FATAL

logger.retrying.name = org.apache.spark.network.shuffle.RetryingBlockTransferor
logger.retrying.level = FATAL

# Keep important Spark logs at WARN
logger.scheduler.name = org.apache.spark.scheduler
logger.scheduler.level = WARN

logger.executor.name = org.apache.spark.executor
logger.executor.level = WARN

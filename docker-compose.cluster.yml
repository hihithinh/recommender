# Docker Compose cho Distributed Cluster
# Mỗi máy có thể chạy bất kỳ service nào: master, worker, hoặc cả hai
# Chỉ cần start services bạn muốn chạy trên máy đó

services:
  # ============================================
  # SPARK MASTER
  # ============================================
  spark-master:
    build:
      context: ./docker/spark-master
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_DRIVER_HOST=${MASTER_TAILSCALE_IP:-spark-master}
      - MASTER_TAILSCALE_IP=${MASTER_TAILSCALE_IP}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "6066:6066"  # Spark Master REST API
      - "4040:4040"  # Spark Application UI
      - "35000:35000"  # Driver RPC port
      - "35001:35001"  # Driver BlockManager port
      - "35002:35002"  # Driver port (dynamic)
    volumes:
      - ./data:/opt/spark-data
      - ./data/raw:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./conf:/opt/conf
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # SPARK WORKERS
  # ============================================
  # Chạy nhiều workers trên 1 máy bằng cách start từng service riêng
  
  spark-worker-1:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://${MASTER_TAILSCALE_IP}:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-8g}
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MASTER_TAILSCALE_IP=${MASTER_TAILSCALE_IP}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8081:8081"
    volumes:
      - worker-1-cache:/opt/spark-data
      - worker-1-logs:/opt/spark/logs
      - ./scripts:/opt/scripts
      - ./docker/spark-worker/entrypoint.sh:/entrypoint-custom.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-custom.sh"]
    networks:
      - spark-network
    extra_hosts:
      - "spark-master:${MASTER_TAILSCALE_IP}"
      - "namenode:${MASTER_TAILSCALE_IP}"
      - "datanode-1:${MASTER_TAILSCALE_IP}"
      - "100.82.67.64:${MASTER_TAILSCALE_IP}"
    healthcheck:
      test: ["CMD", "sh", "/opt/scripts/check_worker_health.sh", "8081", "${MASTER_TAILSCALE_IP}"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  spark-worker-2:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://${MASTER_TAILSCALE_IP}:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-8g}
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MASTER_TAILSCALE_IP=${MASTER_TAILSCALE_IP}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8082:8082"
    volumes:
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - worker-2-cache:/opt/spark-data
      - worker-2-logs:/opt/spark/logs
      - ./docker/spark-worker/entrypoint.sh:/entrypoint-custom.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-custom.sh"]
    networks:
      - spark-network
    extra_hosts:
      - "spark-master:${MASTER_TAILSCALE_IP}"
      - "namenode:${MASTER_TAILSCALE_IP}"
      - "datanode-1:${MASTER_TAILSCALE_IP}"
      - "100.82.67.64:${MASTER_TAILSCALE_IP}"
      - "kafka:${MASTER_TAILSCALE_IP}"
    healthcheck:
      test: ["CMD", "sh", "/opt/scripts/check_worker_health.sh", "8082", "${MASTER_TAILSCALE_IP}"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  spark-worker-3:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-3
    hostname: spark-worker-3
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://${MASTER_TAILSCALE_IP}:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-8g}
      - SPARK_WORKER_WEBUI_PORT=8083
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - MASTER_TAILSCALE_IP=${MASTER_TAILSCALE_IP}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8083:8083"
    volumes:
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - worker-3-cache:/opt/spark-data
      - worker-3-logs:/opt/spark/logs
      - ./docker/spark-worker/entrypoint.sh:/entrypoint-custom.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-custom.sh"]
    networks:
      - spark-network
    extra_hosts:
      - "spark-master:${MASTER_TAILSCALE_IP}"
      - "namenode:${MASTER_TAILSCALE_IP}"
      - "datanode-1:${MASTER_TAILSCALE_IP}"
      - "100.82.67.64:${MASTER_TAILSCALE_IP}"
      - "kafka:${MASTER_TAILSCALE_IP}"
    healthcheck:
      test: ["CMD", "sh", "/opt/scripts/check_worker_health.sh", "8083", "${MASTER_TAILSCALE_IP}"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 40s
    restart: unless-stopped

  # ============================================
  # HDFS - Distributed File System
  # ============================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"  # HDFS Web UI - EXPOSED
      - "9000:9000"  # HDFS RPC - EXPOSED for workers
      - "8020:8020"  # HDFS RPC alternative port
    environment:
      - CLUSTER_NAME=spark-hdfs
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
      - HDFS_CONF_dfs_namenode_rpc___bind___host=0.0.0.0
      - HDFS_CONF_dfs_namenode_servicerpc___bind___host=0.0.0.0
      - HDFS_CONF_dfs_namenode_http___bind___host=0.0.0.0
      - HDFS_CONF_dfs_namenode_https___bind___host=0.0.0.0
      - HDFS_CONF_dfs_client_failover_proxy_provider=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
    volumes:
      - ./hdfs/namenode:/hadoop/dfs/name  # HDFS internal metadata
      - ./data:/data  # Parquet files - readable from host
    networks:
      - spark-network
    restart: unless-stopped

  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: datanode-1
    hostname: datanode-1
    depends_on:
      - namenode
    ports:
      - "9864:9864"  # Datanode HTTP - EXPOSED
      - "9866:9866"  # Datanode data transfer - EXPOSED for workers
      - "9867:9867"  # Datanode IPC - EXPOSED
      - "50010:50010"  # Datanode data transfer (legacy)
      - "50020:50020"  # Datanode IPC (legacy)
      - "50075:50075"  # Datanode HTTP (legacy)
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9866
      - HDFS_CONF_dfs_datanode_http___address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc___address=0.0.0.0:9867
      - HDFS_CONF_dfs_client_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_hostname=${MASTER_TAILSCALE_IP}
    volumes:
      - ./hdfs/datanode-1:/hadoop/dfs/data  # HDFS internal blocks
      - ./data:/data  # Parquet files - readable from host
    networks:
      - spark-network
    restart: unless-stopped

  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: datanode-2
    hostname: datanode-2
    depends_on:
      - namenode
    ports:
      - "9865:9864"  # Datanode HTTP
      - "9868:9866"  # Datanode data transfer
      - "9869:9867"  # Datanode IPC
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9866
      - HDFS_CONF_dfs_datanode_http___address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc___address=0.0.0.0:9867
      - HDFS_CONF_dfs_client_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_hostname=${MASTER_TAILSCALE_IP}
    volumes:
      - ./hdfs/datanode-2:/hadoop/dfs/data
      - ./data:/data
    networks:
      - spark-network
    restart: unless-stopped

  datanode-3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: datanode-3
    hostname: datanode-3
    depends_on:
      - namenode
    ports:
      - "9871:9864"  # Datanode HTTP
      - "9872:9866"  # Datanode data transfer
      - "9873:9867"  # Datanode IPC
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_datanode_data_dir=/hadoop/dfs/data
      - HDFS_CONF_dfs_datanode_address=0.0.0.0:9866
      - HDFS_CONF_dfs_datanode_http___address=0.0.0.0:9864
      - HDFS_CONF_dfs_datanode_ipc___address=0.0.0.0:9867
      - HDFS_CONF_dfs_client_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_use_datanode_hostname=false
      - HDFS_CONF_dfs_datanode_hostname=${MASTER_TAILSCALE_IP}
    volumes:
      - ./hdfs/datanode-3:/hadoop/dfs/data
      - ./data:/data
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # JUPYTER LAB (chỉ chạy trên máy có Master)
  # ============================================
  jupyter-notebook:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: jupyter-notebook
    hostname: jupyter
    depends_on:
      - spark-master
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/notebooks
      - ./src:/home/jovyan/src
      - ./scripts:/home/jovyan/scripts
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # API SERVER (chỉ chạy trên máy có Master)
  # ============================================
  api-server:
    build:
      context: ./docker/api-server
      dockerfile: Dockerfile
    container_name: api-server
    hostname: api-server
    depends_on:
      - spark-master
    ports:
      - "5001:5000"
    volumes:
      - ./src:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./data/raw:/opt/raw-data
      - ./templates:/opt/spark-apps/templates
      - ./static:/opt/spark-apps/static
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - DATA_PATH=/opt/spark-data
      - MODEL_PATH=/opt/spark-data/models
      - PYTHONPATH=/opt/spark-apps
    networks:
      - spark-network
    restart: unless-stopped

networks:
  spark-network:
    driver: bridge

volumes:
  namenode-data:
  datanode-1-data:
  datanode-2-data:
  datanode-3-data:
  worker-1-cache:
  worker-1-logs:
  worker-2-cache:
  worker-2-logs:
  worker-3-cache:
  worker-3-logs:

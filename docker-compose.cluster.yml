# Docker Compose cho Distributed Cluster
# Mỗi máy có thể chạy bất kỳ service nào: master, worker, hoặc cả hai
# Chỉ cần start services bạn muốn chạy trên máy đó

services:
  # ============================================
  # SPARK MASTER
  # ============================================
  spark-master:
    build:
      context: ./docker/spark-master
      dockerfile: Dockerfile
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_HOST=0.0.0.0
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "6066:6066"  # Spark Master REST API
      - "4040:4040"  # Spark Application UI
    volumes:
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - ./logs/spark:/opt/spark/logs
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # SPARK WORKER
  # ============================================
  # Để chạy nhiều workers trên 1 máy:
  # docker compose -f docker-compose.cluster.yml up -d spark-worker
  # WORKER_ID=2 docker compose -f docker-compose.cluster.yml up -d spark-worker-2
  
  spark-worker:
    build:
      context: ./docker/spark-worker
      dockerfile: Dockerfile
    container_name: spark-worker-${WORKER_ID:-1}
    hostname: spark-worker-${WORKER_ID:-1}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://${MASTER_TAILSCALE_IP}:7077
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-4}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-8g}
      - SPARK_WORKER_WEBUI_PORT=808${WORKER_ID:-1}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_LOCAL_IP=${THIS_MACHINE_IP:-0.0.0.0}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    ports:
      - "808${WORKER_ID:-1}:808${WORKER_ID:-1}"  # Worker Web UI
      - "7000-7100:7000-7100"  # Worker communication ports
    volumes:
      - ./src:/opt/spark-apps
      - ./scripts:/opt/scripts
      - worker-${WORKER_ID:-1}-cache:/opt/spark-data
      - worker-${WORKER_ID:-1}-logs:/opt/spark/logs
    networks:
      - spark-network
    extra_hosts:
      - "spark-master:${MASTER_TAILSCALE_IP}"
      - "kafka:${MASTER_TAILSCALE_IP}"
    restart: unless-stopped

  # ============================================
  # KAFKA + ZOOKEEPER (chỉ chạy trên máy có Master)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - spark-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${MASTER_TAILSCALE_IP:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - spark-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # JUPYTER LAB (chỉ chạy trên máy có Master)
  # ============================================
  jupyter-notebook:
    build:
      context: ./docker/jupyter
      dockerfile: Dockerfile
    container_name: jupyter-notebook
    hostname: jupyter
    depends_on:
      - spark-master
      - kafka
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/jovyan/data
      - ./raw_data:/home/jovyan/raw_data
      - ./notebooks:/home/jovyan/notebooks
      - ./src:/home/jovyan/src
      - ./scripts:/home/jovyan/scripts
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - JUPYTER_ENABLE_LAB=yes
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - spark-network
    restart: unless-stopped

  # ============================================
  # API SERVER (chỉ chạy trên máy có Master)
  # ============================================
  api-server:
    build:
      context: ./docker/api-server
      dockerfile: Dockerfile
    container_name: api-server
    hostname: api-server
    depends_on:
      - spark-master
    ports:
      - "5001:5000"
    volumes:
      - ./src:/opt/spark-apps
      - ./data:/opt/spark-data
      - ./raw_data:/opt/raw-data
      - ./templates:/opt/spark-apps/templates
      - ./static:/opt/spark-apps/static
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - DATA_PATH=/opt/spark-data
      - MODEL_PATH=/opt/spark-data/models
      - PYTHONPATH=/opt/spark-apps
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    networks:
      - spark-network
    restart: unless-stopped

networks:
  spark-network:
    driver: bridge

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  worker-1-cache:
  worker-1-logs:
  worker-2-cache:
  worker-2-logs:
  worker-3-cache:
  worker-3-logs:
